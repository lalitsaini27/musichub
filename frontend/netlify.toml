[build]
  command = "npm run build"
  publish = "dist"

# React Router uses client-side routing — without this, refreshing or
# directly opening any route other than "/" (e.g. /artist/some-slug)
# would 404 on Netlify, since there's no matching file on disk for it.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  NODE_VERSION = "20"
